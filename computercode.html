<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>程式碼範例網頁</title>
    <style>
        /* 整體容器樣式 */
        .container {
            font-family: Arial, sans-serif;
            border: 2px solid #000;
            padding: 20px;
            width: fit-content;
            margin: 50px auto;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
        }

        /* 一般文字樣式 (襯線或無襯線體) */
        .normal-text {
            font-size: 24px;
            margin-bottom: 30px;
        }

        /* 電腦代碼樣式 (等寬字體) */
        pre {
            font-family: "Courier New", Courier, monospace;
            font-size: 18px;
            line-height: 1.2;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="normal-text">Code example:</div>

        <pre>
var person = {
  firstName: "鈺婷",
  lastName : "邱",
  studentId: "113403034"
}</pre>
    </div>

</body>
</html>
