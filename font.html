<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>113403034</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            padding: 40px;
            background-color: white;
        }

        /* Heading 1: 粗體、上邊框、粉色文字陰影 */
        h1 {
            display: inline-block;
            font-size: 48px;
            margin: 0 0 40px 0;
            border-top: 3px solid black;
            padding-top: 5px;
            text-shadow: 4px 4px 5px rgba(255, 182, 193, 0.8);
        }

        /* Heading 2: 斜體、黃色粗邊框內含細黑框 */
        h2 {
            font-size: 32px;
            font-style: italic;
            font-weight: normal;
            border: 5px solid yellow;
            outline: 1px solid black;
            padding: 10px;
            margin-bottom: 40px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Heading 3: 右對齊、底線、最後一個字母有下標感 */
        h3 {
            text-align: right;
            font-size: 24px;
            text-decoration: underline;
            margin: 0;
        }

        /* 處理數字 3 的特殊下劃線效果 */
        h3 span {
            text-decoration: underline;
            border-bottom: 2px solid black;
        }
    </style>
</head>
<body>

    <h1>This is heading 1</h1>

    <h2>This is heading 2</h2>

    <h3>This is heading <u>3</u></h3>

</body>
</html>
