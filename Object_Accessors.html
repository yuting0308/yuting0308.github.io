<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript 物件屬性操作</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="card-title mb-0">JavaScript Object 操作結果</h3>
                    </div>
                    <div class="card-body">
                        
                        <h5 class="text-secondary">原始物件的所有屬性 (Properties)：</h5>
                        <div class="alert alert-info">
                            <ul id="property-list" class="mb-0"></ul>
                        </div>

                        <hr>

                        <h5 class="text-secondary">刪除 age 屬性後的物件狀態：</h5>
                        <pre id="object-result" class="bg-dark text-light p-3 rounded"><code></code></pre>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 原始範例物件
        var Person = {
            firstName : "Tony",
            lastName : "Lee",
            age : 50,
            eyeColor : "Blue"
        };

        // 1. 取得並列出所有屬性
        var properties = Object.keys(Person);
        var propertyListUl = document.getElementById('property-list');
        
        properties.forEach(function(prop) {
            var li = document.createElement('li');
            li.textContent = prop;
            propertyListUl.appendChild(li);
        });

        // 2. 靜態執行刪除（不留網頁提示畫面）
        delete Person.age;

        // 3. 將刪除後的物件印到網頁畫面上
        var resultElement = document.getElementById('object-result').querySelector('code');
        resultElement.textContent = JSON.stringify(Person, null, 4);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
