<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>CSS Image Styling Practice</title>
    <style>
        .container {
            display: flex;
            align-items: center; /* 垂直居中 */
            justify-content: space-between;
            padding: 20px;
            gap: 10px;
        }

        /* 共同樣式：設定高度讓對比更明顯 */
        .img-item {
            height: 300px; /* 圖中右側標註的高度 */
        }

        /* 左圖：無變形 + 圓角 */
        .left-img {
            width: 33%;
            border-radius: 18px;
            object-fit: cover; /* 關鍵：裁切而不變形 */
        }

        /* 中圖：圓形 + 邊框 */
        .center-img {
            width: 150px;
            height: 150px;
            border-radius: 50%; /* 變成正圓 */
            border: 2px solid #000; /* 圖中標註有 border */
            object-fit: cover;
        }

        /* 右圖：變形範例 */
        .right-img {
            width: 33%;
            height: 300px;
            /* 預設行為會導致 distortion */
            object-fit: fill; 
        }

        /* 標註文字樣式 (非練習核心) */
        .label {
            text-align: center;
            font-family: cursive;
            color: green;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://picsum.photos/800/1200" alt="No Distortion" class="img-item left-img">

        <img src="https://picsum.photos/600/600" alt="Circle" class="center-img">

        <img src="https://picsum.photos/800/1200" alt="Distortion" class="img-item right-img">
    </div>

</body>
</html>
