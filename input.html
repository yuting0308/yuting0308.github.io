<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>學生資訊表單</title>
    <style>
        /* 簡單的樣式調整，讓外觀更接近圖片 */
        body {
            font-family: serif; /* 圖片中使用襯線體 */
            padding: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 24px;
            margin-bottom: 5px;
        }
        input[type="text"] {
            font-size: 20px;
            padding: 5px;
            width: 300px;
        }
        .button-group {
            margin-top: 30px;
        }
        button, input[type="reset"] {
            font-size: 20px;
            padding: 5px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <form id="studentForm">
        <div class="form-group">
            <label for="firstName">First name:</label>
            <input type="text" id="firstName" name="firstName" value="Your first name">
        </div>

        <div class="form-group">
            <label for="lastName">Last name:</label>
            <input type="text" id="lastName" name="lastName" value="Your last name">
        </div>

        <div class="form-group">
            <label for="studentId">Student ID:</label>
            <input type="text" id="studentId" name="studentId" value="Your student ID">
        </div>

        <div class="button-group">
            <button type="submit">Submit</button>

            <input type="reset" value="重設">
        </div>
    </form>

    <script>
        // 防止表單提交後的頁面跳轉（僅供測試效果）
        document.getElementById('studentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('表單已提交！');
        });
    </script>

</body>
</html>
